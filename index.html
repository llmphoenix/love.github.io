<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>甄玥，我爱你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
        }

        html {
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 25%, #ff9a9e 50%, #fad0c4 75%, #ffd1ff 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 漂浮爱心背景 */
        #hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 105, 135, 0.6);
            animation: floatUp linear infinite;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(0.5);
                opacity: 0;
            }
        }

        /* 主内容容器 */
        .main-container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 900px;
            width: 100%;
        }

        /* 标题区域 */
        .title-section {
            margin-bottom: 30px;
        }

        .main-title {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 300;
            color: #d6336c;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.5);
            letter-spacing: 8px;
            margin-bottom: 15px;
            animation: titleFadeIn 2s ease-out;
        }

        .subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            color: #a61e4d;
            opacity: 0.8;
            letter-spacing: 4px;
            animation: titleFadeIn 2s ease-out 0.3s both;
        }

        @keyframes titleFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 计时器 */
        .timer-section {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 20px;
            margin: 0 auto 40px;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(214, 51, 108, 0.15);
            animation: titleFadeIn 2s ease-out 0.6s both;
        }

        .timer-label {
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: #a61e4d;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .timer-display {
            display: flex;
            justify-content: center;
            gap: clamp(8px, 2vw, 20px);
            flex-wrap: wrap;
        }

        .timer-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }

        .timer-number {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 600;
            color: #d6336c;
            font-variant-numeric: tabular-nums;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.5);
        }

        .timer-text {
            font-size: clamp(0.7rem, 1.5vw, 0.85rem);
            color: #c2255c;
            margin-top: 4px;
            opacity: 0.8;
        }

        /* 导航卡片 */
        .nav-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            animation: titleFadeIn 2s ease-out 0.9s both;
        }

        .nav-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(214, 51, 108, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s ease;
        }

        .nav-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 40px rgba(214, 51, 108, 0.25);
            background: rgba(255, 255, 255, 0.45);
        }

        .nav-card:hover::before {
            left: 100%;
        }

        .nav-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
        }

        .card-title {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-weight: 600;
            color: #d6336c;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .card-desc {
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            color: #a61e4d;
            opacity: 0.75;
            line-height: 1.5;
        }

        /* 底部签名 */
        .footer-signature {
            margin-top: 40px;
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            color: #a61e4d;
            opacity: 0.6;
            letter-spacing: 3px;
            animation: titleFadeIn 2s ease-out 1.2s both;
        }

        /* 音乐控制按钮 */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50px;
            padding: 10px 20px;
            color: #d6336c;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .music-control:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: translateX(3px);
            box-shadow: 0 4px 15px rgba(214, 51, 108, 0.2);
        }

        .music-control.playing .music-icon {
            animation: musicSpin 2s linear infinite;
        }

        @keyframes musicSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 手机端适配 */
        @media (max-width: 480px) {
            body {
                padding: 15px;
                justify-content: flex-start;
                padding-top: 40px;
            }

            .main-title {
                letter-spacing: 4px;
            }

            .timer-section {
                padding: 20px 15px;
                margin-bottom: 30px;
            }

            .timer-unit {
                min-width: 50px;
            }

            .nav-cards {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .nav-card {
                padding: 20px 15px;
            }

            .card-icon {
                font-size: 2rem;
            }

            /* 音乐按钮：避开刘海安全区，且触摸目标≥44px */
            .music-control {
                top: calc(15px + env(safe-area-inset-top));
                right: calc(15px + env(safe-area-inset-right));
                padding: 8px 15px;
                font-size: 0.8rem;
                min-height: 44px;
            }

            .music-text {
                display: none;
            }
        }

        /* 平板适配 */
        @media (min-width: 481px) and (max-width: 768px) {
            .nav-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ===== 手机横屏适配（仅移动宽度 ≤1024px，高度 < 500px） ===== */
        /* 注意：必须限定 max-width，否则 PC 矮窗口（宽屏高度<500）会误触发 */
        @media (max-width: 1024px) and (orientation: landscape) and (max-height: 500px) {
            body {
                padding-top: 55px;
            }

            .main-title {
                font-size: clamp(1.3rem, 3.5vw, 1.8rem);
                letter-spacing: 4px;
                margin-bottom: 6px;
            }

            .subtitle {
                font-size: clamp(0.7rem, 2vw, 0.9rem);
                letter-spacing: 2px;
            }

            .title-section {
                margin-bottom: 10px;
            }

            .timer-section {
                padding: 10px 15px;
                margin-bottom: 14px;
                border-radius: 14px;
            }

            .timer-label {
                margin-bottom: 6px;
                font-size: 0.75rem;
            }

            .timer-number {
                font-size: clamp(1.1rem, 3vw, 1.5rem);
            }

            /* 十二个子页面：横屏用 4 列三排（更宽裕，避免太挤） */
            .nav-cards {
                grid-template-columns: repeat(4, 1fr);
                gap: 7px;
                max-width: 640px;
            }

            .nav-card {
                padding: 7px 6px;
                border-radius: 11px;
            }

            .card-icon {
                font-size: 1.4rem;
                margin-bottom: 4px;
            }

            .card-title {
                font-size: 0.8rem;
                margin-bottom: 3px;
            }

            .card-desc {
                font-size: 0.62rem;
            }

            .footer-signature {
                margin-top: 14px;
                font-size: 0.7rem;
            }

            .music-control {
                top: calc(10px + env(safe-area-inset-top));
                right: calc(10px + env(safe-area-inset-right));
                min-height: 36px;
                padding: 6px 12px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <script src="js/timer.js?v=20260814-mobile"></script>
    <!-- 爱心流星鼠标轨迹拖尾 -->
    <script src="js/heart-trail.js?v=20260814-mobile"></script>
    <!-- 统一背景音乐播放器（随机播放，跨页面延续） -->
    <script src="js/music-player.js?v=20260822"></script>
    <script>
        // 恋爱计时器（逻辑统一在 js/timer.js，此处只配置起始时间）
        LoveTimer.init({ startDate: '2022-11-20T19:00:00', mode: 'digital' });

        // 漂浮爱心背景
        const heartsBg = document.getElementById('hearts-bg');
        const heartSymbols = ['❤', '💕', '💗', '💖', '💝', '🌸', '✨'];

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (Math.random() * 20 + 12) + 'px';
            heart.style.animationDuration = (Math.random() * 8 + 8) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            heart.style.opacity = Math.random() * 0.5 + 0.3;
            heartsBg.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 18000);
        }

        // 初始创建一批爱心
        for (let i = 0; i < 15; i++) {
            setTimeout(createFloatingHeart, i * 300);
        }

        // 持续生成爱心（移动端降低频率，避免小屏上动画过多卡顿）
        const mobileHeart = window.innerWidth <= 480;
        setInterval(createFloatingHeart, mobileHeart ? 1400 : 800);

        // 限制最大爱心数量
        const maxHearts = mobileHeart ? 25 : 40;
        setInterval(() => {
            if (heartsBg.children.length > maxHearts) {
                heartsBg.removeChild(heartsBg.firstChild);
            }
        }, 2000);

        // 背景音乐（随机播放，逻辑统一在 js/music-player.js）
        MusicPlayer.init({ audioDir: 'audio', buttonId: 'musicBtn' });
    </script>
