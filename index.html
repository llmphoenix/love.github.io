<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>甄玥，我爱你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 25%, #ff9a9e 50%, #fad0c4 75%, #ffd1ff 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 漂浮爱心背景 */
        #hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 105, 135, 0.6);
            animation: floatUp linear infinite;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(0.5);
                opacity: 0;
            }
        }

        /* 主内容容器 */
        .main-container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 900px;
            width: 100%;
        }

        /* 标题区域 */
        .title-section {
            margin-bottom: 30px;
        }

        .main-title {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 300;
            color: #d6336c;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.5);
            letter-spacing: 8px;
            margin-bottom: 15px;
            animation: titleFadeIn 2s ease-out;
        }

        .subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            color: #a61e4d;
            opacity: 0.8;
            letter-spacing: 4px;
            animation: titleFadeIn 2s ease-out 0.3s both;
        }

        @keyframes titleFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 计时器 */
        .timer-section {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 20px;
            margin: 0 auto 40px;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(214, 51, 108, 0.15);
            animation: titleFadeIn 2s ease-out 0.6s both;
        }

        .timer-label {
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: #a61e4d;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .timer-display {
            display: flex;
            justify-content: center;
            gap: clamp(8px, 2vw, 20px);
            flex-wrap: wrap;
        }

        .timer-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }

        .timer-number {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 600;
            color: #d6336c;
            font-variant-numeric: tabular-nums;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.5);
        }

        .timer-text {
            font-size: clamp(0.7rem, 1.5vw, 0.85rem);
            color: #c2255c;
            margin-top: 4px;
            opacity: 0.8;
        }

        /* 导航卡片 */
        .nav-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            animation: titleFadeIn 2s ease-out 0.9s both;
        }

        .nav-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(214, 51, 108, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s ease;
        }

        .nav-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 40px rgba(214, 51, 108, 0.25);
            background: rgba(255, 255, 255, 0.45);
        }

        .nav-card:hover::before {
            left: 100%;
        }

        .nav-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
        }

        .card-title {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-weight: 600;
            color: #d6336c;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .card-desc {
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            color: #a61e4d;
            opacity: 0.75;
            line-height: 1.5;
        }

        /* 底部签名 */
        .footer-signature {
            margin-top: 40px;
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            color: #a61e4d;
            opacity: 0.6;
            letter-spacing: 3px;
            animation: titleFadeIn 2s ease-out 1.2s both;
        }

        /* 音乐控制按钮 */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50px;
            padding: 10px 20px;
            color: #d6336c;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .music-control:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: translateX(3px);
            box-shadow: 0 4px 15px rgba(214, 51, 108, 0.2);
        }

        .music-control.playing .music-icon {
            animation: musicSpin 2s linear infinite;
        }

        @keyframes musicSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 手机端适配 */
        @media (max-width: 480px) {
            body {
                padding: 15px;
                justify-content: flex-start;
                padding-top: 40px;
            }

            .main-title {
                letter-spacing: 4px;
            }

            .timer-section {
                padding: 20px 15px;
                margin-bottom: 30px;
            }

            .timer-unit {
                min-width: 50px;
            }

            .nav-cards {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .nav-card {
                padding: 20px 15px;
            }

            .card-icon {
                font-size: 2rem;
            }
        }

        /* 平板适配 */
        @media (min-width: 481px) and (max-width: 768px) {
            .nav-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="hearts-bg"></div>

    <div class="music-control" id="musicBtn">
        <span class="music-icon">🎵</span>
        <span class="music-text">播放音乐</span>
    </div>

    <div class="main-container">
        <div class="title-section">
            <h1 class="main-title">甄 玥</h1>
            <p class="subtitle">我 爱 你</p>
        </div>

        <div class="timer-section">
            <div class="timer-label">我们已经相爱了</div>
            <div class="timer-display">
                <div class="timer-unit">
                    <span class="timer-number" id="days">00</span>
                    <span class="timer-text">天</span>
                </div>
                <div class="timer-unit">
                    <span class="timer-number" id="hours">00</span>
                    <span class="timer-text">时</span>
                </div>
                <div class="timer-unit">
                    <span class="timer-number" id="minutes">00</span>
                    <span class="timer-text">分</span>
                </div>
                <div class="timer-unit">
                    <span class="timer-number" id="seconds">00</span>
                    <span class="timer-text">秒</span>
                </div>
            </div>
        </div>

        <div class="nav-cards">
            <a href="html/loveweb/index.html" class="nav-card">
                <span class="card-icon">💗</span>
                <div class="card-title">心动时刻</div>
                <div class="card-desc">爱你，仿若流风之回雪</div>
            </a>
            <a href="html/loveweb2/index.html" class="nav-card">
                <span class="card-icon">💌</span>
                <div class="card-title">代码情书</div>
                <div class="card-desc">一眼万年，甄爱一生</div>
            </a>
            <a href="html/loveweb3/index.html" class="nav-card">
                <span class="card-icon">🌌</span>
                <div class="card-title">星空誓言</div>
                <div class="card-desc">执子之手，与子偕老</div>
            </a>
        </div>

        <div class="footer-signature">— 明 爱 玥 —</div>
    </div>

    <script src="js/timer.js"></script>
    <!-- 爱心流星鼠标轨迹拖尾 -->
    <script src="js/heart-trail.js"></script>
    <script>
        // 恋爱计时器（逻辑统一在 js/timer.js，此处只配置起始时间）
        LoveTimer.init({ startDate: '2022-11-20T19:00:00', mode: 'digital' });

        // 漂浮爱心背景
        const heartsBg = document.getElementById('hearts-bg');
        const heartSymbols = ['❤', '💕', '💗', '💖', '💝', '🌸', '✨'];

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (Math.random() * 20 + 12) + 'px';
            heart.style.animationDuration = (Math.random() * 8 + 8) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            heart.style.opacity = Math.random() * 0.5 + 0.3;
            heartsBg.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 18000);
        }

        // 初始创建一批爱心
        for (let i = 0; i < 15; i++) {
            setTimeout(createFloatingHeart, i * 300);
        }

        // 持续生成爱心
        setInterval(createFloatingHeart, 800);

        // 限制最大爱心数量
        setInterval(() => {
            if (heartsBg.children.length > 40) {
                heartsBg.removeChild(heartsBg.firstChild);
            }
        }, 2000);

        // 背景音乐控制（默认自动播放）
        var bgMusic = new Audio('audio/Broken Elegance.mp3');
        bgMusic.loop = true;
        bgMusic.preload = 'auto';
        var musicBtn = document.getElementById('musicBtn');
        var isPlaying = false;

        function updateMusicBtn() {
            musicBtn.querySelector('.music-icon').textContent = isPlaying ? '🎶' : '🎵';
            musicBtn.querySelector('.music-text').textContent = isPlaying ? '暂停音乐' : '播放音乐';
            musicBtn.classList.toggle('playing', isPlaying);
        }

        // 尝试自动播放（浏览器需用户交互才会放行）
        function tryAutoPlay() {
            bgMusic.play().then(function() {
                isPlaying = true;
                updateMusicBtn();
            }).catch(function() {
                // 自动播放被拦截，保持待播放状态
            });
        }
        tryAutoPlay();

        // 首次用户交互时若还没播放，立即尝试播放（覆盖自动播放限制）
        function tryPlayOnInteract() {
            if (!isPlaying) {
                bgMusic.play().then(function() {
                    isPlaying = true;
                    updateMusicBtn();
                }).catch(function(e) {
                    console.log('播放失败:', e);
                });
            }
        }
        document.addEventListener('click', tryPlayOnInteract, { once: true });
        document.addEventListener('touchstart', tryPlayOnInteract, { once: true });

        musicBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
            } else {
                bgMusic.play().then(function() {
                    isPlaying = true;
                }).catch(function(e) {
                    console.log('播放失败:', e);
                });
            }
            updateMusicBtn();
        });
    </script>
</body>
</html>
