<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心动时刻 - 明爱玥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #fff0f5 0%, #ffe4ec 30%, #ffd6e0 60%, #ffc8d8 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 飘落文字容器 */
        #falling-chars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .falling-char {
            position: absolute;
            top: -40px;
            font-size: 20px;
            font-weight: 300;
            color: rgba(214, 51, 108, 0.6);
            animation: fallDown linear forwards;
            user-select: none;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes fallDown {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 50px;
            padding: 10px 20px;
            text-decoration: none;
            color: #d6336c;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: translateX(-3px);
            box-shadow: 0 4px 15px rgba(214, 51, 108, 0.2);
        }

        /* 主内容 */
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }

        /* 爱心 */
        .heart-container {
            position: relative;
            width: clamp(120px, 30vw, 200px);
            height: clamp(120px, 30vw, 200px);
            margin: 0 auto 40px;
        }

        .heart {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            top: 0;
            width: 50%;
            height: 80%;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            border-radius: 50% 50% 0 0;
            box-shadow: 0 0 30px rgba(255, 107, 157, 0.5);
        }

        .heart::before {
            left: 50%;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        /* 爱心光晕 */
        .heart-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(255, 107, 157, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 1.2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
            60% { transform: scale(1); }
        }

        @keyframes glowPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.3; }
        }

        /* 标题 */
        .page-title {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 300;
            color: #d6336c;
            letter-spacing: 6px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.6);
        }

        /* 计时器 */
        .timer-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 30px 25px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(214, 51, 108, 0.15);
            max-width: 500px;
            margin: 0 auto;
        }

        .timer-header {
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: #a61e4d;
            margin-bottom: 20px;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .timer-grid {
            display: flex;
            justify-content: center;
            gap: clamp(10px, 3vw, 25px);
            flex-wrap: wrap;
        }

        .timer-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 55px;
        }

        .timer-value {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 600;
            color: #d6336c;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 1px 1px 4px rgba(255, 255, 255, 0.5);
        }

        .timer-label {
            font-size: clamp(0.7rem, 1.5vw, 0.85rem);
            color: #c2255c;
            margin-top: 8px;
            opacity: 0.7;
        }

        /* 底部情话 */
        .love-quote {
            margin-top: 35px;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #a61e4d;
            opacity: 0.7;
            letter-spacing: 2px;
            font-style: italic;
        }

        /* 手机端适配 */
        @media (max-width: 480px) {
            .back-btn {
                top: 15px;
                left: 15px;
                padding: 8px 15px;
                font-size: 0.8rem;
            }

            .heart-container {
                margin-bottom: 30px;
            }

            .timer-card {
                padding: 20px 15px;
            }

            .timer-item {
                min-width: 45px;
            }

            .love-quote {
                margin-top: 25px;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <div id="falling-chars"></div>

    <a href="../../index.html" class="back-btn">← 返回</a>

    <div class="content">
        <div class="heart-container">
            <div class="heart-glow"></div>
            <div class="heart"></div>
        </div>

        <h1 class="page-title">心 动 时 刻</h1>

        <div class="timer-card">
            <div class="timer-header">甄玥，爱你 已超过</div>
            <div class="timer-grid">
                <div class="timer-item">
                    <span class="timer-value" id="days">00</span>
                    <span class="timer-label">天</span>
                </div>
                <div class="timer-item">
                    <span class="timer-value" id="hours">00</span>
                    <span class="timer-label">时</span>
                </div>
                <div class="timer-item">
                    <span class="timer-value" id="minutes">00</span>
                    <span class="timer-label">分</span>
                </div>
                <div class="timer-item">
                    <span class="timer-value" id="seconds">00</span>
                    <span class="timer-label">秒</span>
                </div>
            </div>
        </div>

        <div class="love-quote">爱你，仿若流风之回雪</div>
    </div>

    <script>
        // 计时器
        const startDate = new Date('2022-11-20T19:00:00');

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        updateTimer();
        setInterval(updateTimer, 1000);

        // 飘落文字
        const fallingChars = document.getElementById('falling-chars');
        const chars = ['明', '玥', '恋', '❤', '爱', '💗'];

        function createFallingChar() {
            const char = document.createElement('div');
            char.className = 'falling-char';
            char.textContent = chars[Math.floor(Math.random() * chars.length)];
            char.style.left = Math.random() * 100 + '%';
            char.style.fontSize = (Math.random() * 16 + 16) + 'px';
            char.style.animationDuration = (Math.random() * 5 + 6) + 's';
            char.style.opacity = Math.random() * 0.4 + 0.3;
            fallingChars.appendChild(char);

            setTimeout(() => {
                char.remove();
            }, 12000);
        }

        // 初始创建
        for (let i = 0; i < 20; i++) {
            setTimeout(createFallingChar, i * 200);
        }

        // 持续生成
        setInterval(createFallingChar, 500);

        // 限制数量
        setInterval(() => {
            if (fallingChars.children.length > 50) {
                fallingChars.removeChild(fallingChars.firstChild);
            }
        }, 1000);
    </script>
</body>
</html>
