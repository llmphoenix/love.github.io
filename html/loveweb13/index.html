<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>暖金落日 - 明爱玥</title>
    <link rel="stylesheet" href="styles/sunset.css?v=20260824">
</head>
<body>
    <a href="../../index.html" class="back-btn">← 返回</a>

    <div class="music-control" id="musicBtn">
        <span class="music-icon">🎵</span>
        <span class="music-text">播放音乐</span>
    </div>

    <!-- 暖金落日主画布 -->
    <canvas id="sunset"></canvas>

    <div class="page-title">暖 金 落 日</div>

    <div class="hint-text">点击天际，撒下余晖柔情 🌇</div>

    <script src="scripts/sunset.js?v=20260824"></script>
    <!-- 爱心流星鼠标轨迹拖尾 -->
    <script src="../../js/heart-trail.js?v=20260814-mobile"></script>
    <!-- 统一背景音乐播放器（随机播放，跨页面延续） -->
    <script src="../../js/music-player.js?v=20260822-v3"></script>
    <!-- 爱情对白播放器（点击屏幕播放男声/女声对白） -->
    <script src="../../js/voice-player.js?v=20260822-v5"></script>
    <!-- 主题环境音播放器（低音量循环） -->
    <script src="../../js/env-player.js?v=20260822-v4"></script>
    <!-- 统一音频解锁（首次交互时启动背景音乐+环境音+对白） -->
    <script src="../../js/audio-unlock.js?v=20260822-v2"></script>
    <script>
        // 背景音乐（随机播放，逻辑统一在 js/music-player.js）
        MusicPlayer.init({ audioDir: '../../audio', buttonId: 'musicBtn' });
        // 爱情对白（点击屏幕随机播放男声/女声/对话，多句不重复）
        VoicePlayer.init({ theme: 'rose', canvasId: 'sunset', audioDir: '../../audio/voices', variants: { f: 2, m: 2, b: 2 } });
        // 环境音（黄昏晚风）
        EnvPlayer.init({ file: 'blossom_breeze.mp3', audioDir: '../../audio/env' });
        // 首次交互时统一解锁所有音频（覆盖浏览器自动播放限制）
        AudioUnlock.init();
    </script>
</body>
</html>
