    <script type="text/javascript">
        var together = "2022-11-20T19:00:00";

        if (!document.createElement('canvas').getContext) {
            var msg = document.createElement("div");
            msg.id = "errorMsg";
            msg.innerHTML = "您的浏览器不支持HTML5<br/>建议使用 Chrome / Firefox / Safari 最新版本";
            document.body.appendChild(msg);
            $("#code").css("display", "none");
        } else {
            $(document).ready(function() {
                setTimeout(function () {
                    startHeartAnimation();
                }, 3000);

                // 恋爱计时（逻辑统一在 js/timer.js，clock 模式渲染到 #elapseClock）
                LoveTimer.init({ startDate: together, mode: 'clock' });

				// adjustCodePosition();
                $("#code").typewriter();
            });
        }

        // 背景音乐控制（默认自动播放）
        (function() {
            var bgMusic = new Audio('../../audio/Broken Elegance.mp3');
            bgMusic.loop = true;
            bgMusic.preload = 'auto';
            var musicBtn = document.getElementById('musicBtn');
            var isPlaying = false;

            function updateMusicBtn() {
                musicBtn.querySelector('.music-icon').textContent = isPlaying ? '🎶' : '🎵';
                musicBtn.querySelector('.music-text').textContent = isPlaying ? '暂停音乐' : '播放音乐';
                musicBtn.classList.toggle('playing', isPlaying);
            }

            // 尝试自动播放（浏览器需用户交互才会放行）
            function tryAutoPlay() {
                bgMusic.play().then(function() {
                    isPlaying = true;
                    updateMusicBtn();
                }).catch(function() {
                    // 自动播放被拦截，保持待播放状态
                });
            }
            tryAutoPlay();

            // 首次用户交互时若还没播放，立即尝试播放（覆盖自动播放限制）
            function tryPlayOnInteract() {
                if (!isPlaying) {
                    bgMusic.play().then(function() {
                        isPlaying = true;
                        updateMusicBtn();
                    }).catch(function(e) {
                        console.log('播放失败:', e);
                    });
                }
            }
            document.addEventListener('click', tryPlayOnInteract, { once: true });
            document.addEventListener('touchstart', tryPlayOnInteract, { once: true });

            musicBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isPlaying) {
                    bgMusic.pause();
                    isPlaying = false;
                } else {
                    bgMusic.play().then(function() {
                        isPlaying = true;
                    }).catch(function(e) {
                        console.log('播放失败:', e);
                    });
                }
                updateMusicBtn();
            });
        })();
    </script>
