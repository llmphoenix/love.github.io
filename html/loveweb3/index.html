<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>星空誓言 - 明爱玥</title>
    <link rel="stylesheet" href="styles/main.css?v=20260814-landfix3">
</head>
<body>
    <a href="../../index.html" class="back-btn">← 返回</a>

    <div class="music-control" id="musicBtn">
        <span class="music-icon">🎵</span>
        <span class="music-text">播放音乐</span>
    </div>

    <div class="container">
        <div class="content">
            <!-- 左侧：心形花朵（镭射闪耀） -->
            <div class="flower-side">
                <canvas id="heartCanvas"></canvas>
            </div>

            <!-- 右侧：粒子文字主舞台 -->
            <div class="stage-side">
                <canvas id="universe"></canvas>
                <canvas id="canvas"></canvas>
            </div>

            <div class="page-title">星 空 誓 言</div>

            <div class="hint-text">点击屏幕切换文字 ✨</div>
        </div>
    </div>

    <script src="scripts/universe.js?v=20260814-dprfix"></script>
    <script src="scripts/heart-flowers.js?v=20260814-mobile"></script>
    <script src="scripts/main.js?v=20260814-particlefix"></script>
    <!-- 爱心流星鼠标轨迹拖尾 -->
    <script src="../../js/heart-trail.js?v=20260814-mobile"></script>
    <!-- 统一背景音乐播放器（随机播放，跨页面延续） -->
    <script src="../../js/music-player.js?v=20260814-mobile"></script>
    <script>
        // 背景音乐（随机播放，逻辑统一在 js/music-player.js）
        MusicPlayer.init({ audioDir: '../../audio', buttonId: 'musicBtn' });
    </script>
</body>
</html>
