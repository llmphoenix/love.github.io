<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星空誓言 - 明爱玥</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <a href="../../index.html" class="back-btn">← 返回</a>

    <div class="music-control" id="musicBtn">
        <span class="music-icon">🎵</span>
        <span class="music-text">播放音乐</span>
    </div>

    <div class="container">
        <div class="content">
            <canvas id="universe"></canvas>
            <canvas id="canvas"></canvas>

            <div class="page-title">星 空 誓 言</div>

            <div class="hint-text">点击屏幕切换文字 ✨</div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="audio/[No Copyright Music] Unconditionally - Broken Elegance.mp3" type="audio/mpeg">
    </audio>

    <script src="scripts/universe.js"></script>
    <script src="scripts/main.js"></script>
    <!-- 爱心流星鼠标轨迹拖尾 -->
    <script src="../../js/heart-trail.js"></script>
    <script>
        // 音乐控制
        var bgMusic = document.getElementById('bgMusic');
        var musicBtn = document.getElementById('musicBtn');
        var isPlaying = false;

        musicBtn.addEventListener('click', function() {
            if (isPlaying) {
                bgMusic.pause();
                musicBtn.querySelector('.music-icon').textContent = '🎵';
                musicBtn.querySelector('.music-text').textContent = '播放音乐';
                musicBtn.classList.remove('playing');
            } else {
                bgMusic.play().then(function() {
                    musicBtn.querySelector('.music-icon').textContent = '🎶';
                    musicBtn.querySelector('.music-text').textContent = '暂停音乐';
                    musicBtn.classList.add('playing');
                    isPlaying = true;
                }).catch(function(e) {
                    console.log('播放失败:', e);
                });
            }
            isPlaying = !isPlaying;
        });
    </script>
</body>
</html>
