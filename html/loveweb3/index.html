<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星空誓言 - 明爱玥</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <a href="../../index.html" class="back-btn">← 返回</a>

    <div class="music-control" id="musicBtn">
        <span class="music-icon">🎵</span>
        <span class="music-text">播放音乐</span>
    </div>

    <div class="container">
        <div class="content">
            <canvas id="universe"></canvas>
            <canvas id="canvas"></canvas>

            <div class="page-title">星 空 誓 言</div>

            <div class="hint-text">点击屏幕切换文字 ✨</div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="../../audio/Broken Elegance.mp3" type="audio/mpeg">
    </audio>

    <script src="scripts/universe.js"></script>
    <script src="scripts/main.js"></script>
    <!-- 爱心流星鼠标轨迹拖尾 -->
    <script src="../../js/heart-trail.js"></script>
    <script>
        // 音乐控制
        var bgMusic = document.getElementById('bgMusic');
        var musicBtn = document.getElementById('musicBtn');
        var isPlaying = false;

        function updateMusicBtn() {
            musicBtn.querySelector('.music-icon').textContent = isPlaying ? '🎶' : '🎵';
            musicBtn.querySelector('.music-text').textContent = isPlaying ? '暂停音乐' : '播放音乐';
            musicBtn.classList.toggle('playing', isPlaying);
        }

        // 尝试自动播放（浏览器需用户交互才会放行）
        function tryAutoPlay() {
            bgMusic.play().then(function() {
                isPlaying = true;
                updateMusicBtn();
            }).catch(function() {
                // 自动播放被拦截，保持待播放状态
            });
        }
        tryAutoPlay();

        // 首次用户交互时若还没播放，立即尝试播放（覆盖自动播放限制）
        function tryPlayOnInteract() {
            if (!isPlaying) {
                bgMusic.play().then(function() {
                    isPlaying = true;
                    updateMusicBtn();
                }).catch(function(e) {
                    console.log('播放失败:', e);
                });
            }
        }
        document.addEventListener('click', tryPlayOnInteract, { once: true });
        document.addEventListener('touchstart', tryPlayOnInteract, { once: true });

        musicBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
            } else {
                bgMusic.play().then(function() {
                    isPlaying = true;
                }).catch(function(e) {
                    console.log('播放失败:', e);
                });
            }
            updateMusicBtn();
        });
    </script>
</body>
</html>
